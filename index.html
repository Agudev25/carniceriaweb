<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carnicería Raza</title>
    <link rel="icon" href="LOGOS/raza_logo_color_web.png" type="image/png" />
    <link rel="stylesheet" href="estilos.css" />
</head>

<body>
    <main class="container">
        <img src="LOGOS/raza_logo_negro_web.png" alt="Logo Raza" class="logo" />
        <h1>¡Muy pronto abrimos!</h1>
        <p>Estamos preparando algo delicioso para ti. Estate atento a nuestra gran apertura.</p>
        <div class="countdown">
            <span>Fecha estimada: 12-04-2026 12:00 PM</span>
            <p id="cdText">Cargando cuenta regresiva...</p>
        </div>
    </main>
    <script>
        const targetDate = new Date('2026-04-12T12:00:00');
        function updateCountdown() {
            const now = new Date();
            const diff = targetDate - now;
            if (diff <= 0) {
                document.getElementById('cdText').textContent = '¡Ya abrimos!';
                return;
            }
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);
            document.getElementById('cdText').textContent = `${days} D ${hours} H ${minutes} M ${seconds} S`;
        }
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>

</html>
